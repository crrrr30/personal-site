default:
  image: node:20-bullseye
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
  variables:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
  interruptible: true

stages:
  - lint
  - build

include:
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/build.yml
